name: Gerar instalador Windows

on:
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: 'Publicar o artefato de um build aprovado (vazio gera novo build)'
        required: false
        type: string
      publish_tag:
        description: 'Tag da pre-release em rascunho para publicar o artefato'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-existing:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
      PUBLISH_TAG: ${{ inputs.publish_tag }}
    steps:
      - name: Conferir e publicar o instalador ja validado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:PUBLISH_RUN_ID -notmatch '^\d+$' -or $env:PUBLISH_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'Informe o ID do build e uma tag vMAJOR.MINOR.PATCH.'
          }
          $build = gh api "repos/$env:GH_REPO/actions/runs/$env:PUBLISH_RUN_ID" | ConvertFrom-Json
          if ($build.conclusion -ne 'success' -or $build.status -ne 'completed' -or $build.head_branch -ne $env:PUBLISH_TAG -or $build.path -ne '.github/workflows/windows-installer.yml') {
            throw 'O build informado nao e um build aprovado desta tag e deste workflow.'
          }
          $ref = gh api "repos/$env:GH_REPO/git/ref/tags/$env:PUBLISH_TAG" | ConvertFrom-Json
          $source = $ref.object.sha
          if ($ref.object.type -eq 'tag') {
            $annotation = gh api "repos/$env:GH_REPO/git/tags/$source" | ConvertFrom-Json
            $source = $annotation.object.sha
          }
          if ($source -ne $build.head_sha) { throw 'O commit da tag difere do build.' }
          $release = gh release view $env:PUBLISH_TAG --json isDraft,isPrerelease | ConvertFrom-Json
          if (-not $release.isDraft -or -not $release.isPrerelease) { throw 'A publicacao exige uma pre-release em rascunho.' }
          gh run download $env:PUBLISH_RUN_ID --name TranscrevoFacil-Windows-Setup --dir release-files
          $name = 'TranscrevoFacil-Setup-' + $env:PUBLISH_TAG.Substring(1) + '.exe'
          $installer = Get-Item -LiteralPath (Join-Path 'release-files' $name)
          $checksum = @(Get-Content release-files/SHA256SUMS.txt | Where-Object { $_ -match ('^([a-fA-F0-9]{64})\s+\*?' + [regex]::Escape($name) + '$') })
          if ($checksum.Count -ne 1) { throw 'Checksum do instalador ausente ou ambiguo.' }
          $expected = ($checksum[0] -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'SHA-256 do instalador divergente.' }
          $provenance = @{
            repository = $env:GH_REPO; tag = $env:PUBLISH_TAG; sourceCommit = $source
            buildRun = $build.html_url; buildConclusion = $build.conclusion
            installer = $name; size = $installer.Length; sha256 = $actual
            publisherRun = "https://github.com/$env:GH_REPO/actions/runs/$env:GITHUB_RUN_ID"
            signature = 'unsigned-test-build'
          }
          $provenance | ConvertTo-Json | Set-Content release-files/BUILD-PROVENANCE.json -Encoding utf8
          $assets = @($installer.FullName, 'release-files/SHA256SUMS.txt', 'release-files/LICENSE', 'release-files/THIRD_PARTY_NOTICES.md', 'release-files/BUILD-PROVENANCE.json')
          gh release upload $env:PUBLISH_TAG @assets
          gh release edit $env:PUBLISH_TAG --draft=false --prerelease --latest=false

  installer:
    if: github.event_name != 'workflow_dispatch' || inputs.publish_run_id == ''
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 != '' }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.14'

      - name: Instalar ferramentas de build
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install-build-tools.ps1

      - name: Instalar dependencias Node.js
        shell: powershell
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate
          pnpm install --prod --frozen-lockfile --config.node-linker=hoisted

      - name: Preparar runtimes, modelos e DLLs
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\prepare-installer-assets.ps1 -PythonCommand python

      - name: Executar testes
        run: pnpm test

      - name: Validar requisitos de publicação
        run: pnpm run verify:release

      - name: Compilar instalador
        shell: powershell
        run: '& $env:ISCC_PATH installer\TranscrevoFacil.iss'

      - name: Validar tamanho para GitHub Release
        shell: powershell
        run: |
          $installer = Get-ChildItem dist-installer\TranscrevoFacil-Setup-*.exe | Select-Object -First 1
          $maximumReleaseBytes = 2GB
          if ($installer.Length -ge $maximumReleaseBytes) {
            throw "O instalador tem $($installer.Length) bytes e excede o limite de 2 GiB por arquivo do GitHub Releases."
          }
          Write-Host "Instalador publicavel: $([math]::Round($installer.Length / 1GB, 2)) GiB."

      - name: Testar instalação limpa
        shell: powershell
        run: |
          $installer = Get-ChildItem dist-installer\TranscrevoFacil-Setup-*.exe | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test-installed-release.ps1 -InstallerPath $installer.FullName

      - name: Assinar release pública
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNING_CERT == 'true'
        shell: powershell
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $installer = Get-ChildItem dist-installer\TranscrevoFacil-Setup-*.exe | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\sign-installer.ps1 -InstallerPath $installer.FullName

      - name: Gerar checksums
        shell: powershell
        run: |
          $lines = Get-ChildItem dist-installer\TranscrevoFacil-Setup-*.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          [System.IO.File]::WriteAllLines((Join-Path $PWD 'dist-installer\SHA256SUMS.txt'), $lines, [System.Text.UTF8Encoding]::new($false))
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md -Destination dist-installer

      - name: Publicar artefato
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TranscrevoFacil-Windows-Setup
          path: |
            dist-installer\TranscrevoFacil-Setup-*.exe
            dist-installer\SHA256SUMS.txt
            dist-installer\LICENSE
            dist-installer\THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 14
